<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="ニュース">
<title>世界のニュース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --text: #16161a;
  --muted: #5c5c64;
  --faint: #8a8a92;
  --line: #e6e3dc;
  --seg: #ebe9e3;
  --tab-on: #ffffff;
  --accent: #b3122b;
  --ok: #1f7a4d;
  --warn: #8a5a00;
  --warn-bg: #fdf3dc;
  --shadow: 0 1px 2px rgba(20, 20, 26, .06), 0 4px 16px rgba(20, 20, 26, .05);
  --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113;
    --surface: #1a1a1d;
    --text: #ededf0;
    --muted: #a3a3ab;
    --faint: #7d7d86;
    --line: #2a2a2f;
    --seg: #222226;
    --tab-on: #3a3a41;
    --accent: #ff6b7a;
    --ok: #4cc38a;
    --warn: #f0c96a;
    --warn-bg: #352a10;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 var(--sans);
  font-feature-settings: "palt";
}
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px calc(env(safe-area-inset-bottom) + 40px); }

/* 見出し部分 */
.masthead { padding: calc(env(safe-area-inset-top) + 20px) 0 12px; display: flex; align-items: flex-start; gap: 12px; }
.masthead-text { flex: 1; min-width: 0; }
.date { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
h1 { margin: 2px 0 0; font: 700 28px/1.25 var(--serif); letter-spacing: .02em; }
.status { margin: 8px 0 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.status.stale { color: var(--warn); font-weight: 600; }
.status.stale .dot { background: var(--warn); }
.icon-btn {
  flex: none; width: 44px; height: 44px; margin-top: 6px; border: 1px solid var(--line); border-radius: 50%;
  background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer;
  transition: background-color .2s, transform .15s;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 20px; height: 20px; }

/* タブ */
.tabbar {
  position: sticky; top: 0; z-index: 2; margin: 0 -16px; padding: calc(env(safe-area-inset-top) + 8px) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
}
[role=tablist] { display: flex; padding: 4px; border-radius: 12px; background: var(--seg); }
[role=tab] {
  flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: none; color: var(--muted);
  font: 600 15px/1 var(--sans); letter-spacing: .06em; cursor: pointer; transition: background-color .2s, color .2s;
}
[role=tab][aria-selected=true] { background: var(--tab-on); color: var(--text); box-shadow: var(--shadow); }

/* 一覧 */
.list { list-style: none; margin: 0; padding: 0; }
.group {
  display: flex; align-items: center; gap: 10px; margin: 22px 0 6px;
  font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--faint);
}
.group::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.list li + li:not(.group) { border-top: 1px solid var(--line); }
.list li.group + li { border-top: 0; }
.list a {
  display: block; padding: 14px 4px; color: inherit; text-decoration: none; border-radius: 10px;
  transition: background-color .15s;
}
.list a:active { background: var(--seg); }
.meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.src { font-weight: 700; color: var(--text); }
.meta time::before { content: "·"; margin-right: 8px; color: var(--faint); }
.new { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
.new::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 4px 1px 0; border-radius: 50%; background: currentColor; vertical-align: middle; }
.title { display: block; margin-top: 4px; font-size: 16.5px; font-weight: 500; line-height: 1.55; }
.list a:visited .title { color: var(--muted); }

/* 先頭の1本は大きく */
.list li.lead { border: 0; }
.list li.lead a {
  margin-top: 12px; padding: 18px 18px 20px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.list li.lead .title { margin-top: 8px; font: 700 21px/1.5 var(--serif); letter-spacing: .01em; }
.list li.lead + li { border-top: 0; }

.empty { padding: 32px 4px; color: var(--muted); }
.note { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.7; color: var(--faint); }

a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) {
  .list a:hover { background: var(--seg); }
  .list li.lead a:hover { background: var(--surface); border-color: var(--faint); }
  .icon-btn:hover { background: var(--seg); }
}
@media (min-width: 600px) {
  h1 { font-size: 32px; }
  .list li.lead .title { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
<div class="masthead">
  <div class="masthead-text">
    <p class="date" id="date"></p>
    <h1>世界のニュース</h1>
    <p class="status" id="status" data-ts="{{UPDATED_TS}}" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text">{{UPDATED}} 更新・30分ごと</span></p>
  </div>
  <button type="button" class="icon-btn" id="reload" aria-label="読み直す">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</div>
<div class="tabbar">
  <div role="tablist" aria-label="ジャンル">
{{TABS}}
  </div>
</div>
{{NOTE}}
{{PANELS}}
<footer>見出しは {{SOURCES}} から自動で集めています。本文は各媒体のサイトで読めます。</footer>
</div>
<script>
(function () {
  var TZ = 'Asia/Tokyo';
  var dayKey = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  var hm = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  var md = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, month: 'numeric', day: 'numeric' });
  var full = new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, month: 'long', day: 'numeric', weekday: 'short' });

  // タブ（#economy のようにURLでも選べる。左右キーで移動）
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
  function show(id, focus) {
    tabs.forEach(function (t) {
      var on = t.id === 't-' + id;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
      if (on && focus) t.focus();
    });
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    try { localStorage.setItem('tab', id); } catch (e) {}
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t.id.slice(2)); window.scrollTo({ top: 0 }); });
    t.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (d) show(tabs[(i + d + tabs.length) % tabs.length].id.slice(2), true);
    });
  });
  var start = location.hash.slice(1);
  if (!document.getElementById('t-' + start)) { try { start = localStorage.getItem('tab'); } catch (e) { start = null; } }
  show(document.getElementById('t-' + start) ? start : tabs[0].id.slice(2));

  function ago(sec) {
    if (sec < 60) return 'たった今';
    if (sec < 3600) return Math.floor(sec / 60) + '分前';
    return Math.floor(sec / 3600) + '時間前';
  }

  // 「この1時間」「今日」「昨日」で区切り、時刻を相対表示にする
  function arrange() {
    var now = Date.now() / 1000;
    var today = dayKey.format(new Date());
    var yest = dayKey.format(new Date(Date.now() - 86400000));
    document.getElementById('date').textContent = full.format(new Date());
    document.querySelectorAll('.list').forEach(function (ul) {
      ul.querySelectorAll('.group, .new').forEach(function (el) { el.remove(); });
      var last = null;
      ul.querySelectorAll('li[data-ts]').forEach(function (li) {
        var ts = +li.dataset.ts, age = now - ts, d = new Date(ts * 1000), k = dayKey.format(d);
        var label = age < 3600 ? 'この1時間' : k === today ? '今日' : k === yest ? '昨日' : md.format(d);
        if (label !== last && !li.classList.contains('lead')) {
          var g = document.createElement('li');
          g.className = 'group';
          g.setAttribute('role', 'presentation');
          g.textContent = label;
          li.parentNode.insertBefore(g, li);
        }
        if (!li.classList.contains('lead')) last = label;
        var t = li.querySelector('time');
        t.textContent = age < 6 * 3600 ? ago(age) : (k === today ? hm.format(d) : md.format(d) + ' ' + hm.format(d));
        if (age < 3600) {
          var n = document.createElement('span');
          n.className = 'new';
          n.textContent = '新着';
          t.after(n);
        }
      });
    });
    var s = document.getElementById('status'), st = document.getElementById('status-text');
    var upd = now - s.dataset.ts, stale = upd > 2 * 3600;
    if (!st.dataset.abs) st.dataset.abs = hm.format(new Date(s.dataset.ts * 1000));
    st.textContent = stale
      ? '更新が止まっています（最終 ' + md.format(new Date(s.dataset.ts * 1000)) + ' ' + st.dataset.abs + '）'
      : st.dataset.abs + ' 更新・' + ago(upd) + '・30分ごと';
    s.classList.toggle('stale', stale);
  }
  arrange();
  setInterval(arrange, 60000);

  document.getElementById('reload').addEventListener('click', function () { location.reload(); });
  // アプリに戻ってきたとき、10分以上たっていれば読み直す
  var loaded = Date.now();
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - loaded > 10 * 60000) location.reload();
  });
})();
</script>
</body>
</html>
