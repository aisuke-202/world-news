name: 見出しを更新

on:
  schedule:
    - cron: "17,47 * * * *"  # 30分ごと（GitHubの混雑で数分〜十数分遅れることがある）
    - cron: "3 0 1 * *"      # 毎月1日：60日間動きがないと定期実行が止まるので、記録を1行足す
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 定期実行が止まらないよう記録を残す（毎月1日だけ）
        if: github.event.schedule == '3 0 1 * *'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "定期実行を続けるための記録"
          git push
